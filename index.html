<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=posts.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千白分享 · 帖子站</title>
    <style>
        body { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "SimHei", sans-serif;
               background: #fdf6f9; color: #2a1a2e; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
        a { color: #c44569; }
    </style>
<script>/* 站点版本标记 + 数据请求不吃缓存 */
(function () {
  var _fetch = window.fetch;
  if (_fetch) {
    window.fetch = function (u, o) {
      o = o || {};
      if (!('cache' in o)) o.cache = 'no-store';
      return _fetch.call(this, u, o);
    };
  }
  function paint() {
    var st = document.createElement('style');
    st.textContent = '#siteVersion{position:fixed;right:10px;bottom:8px;z-index:60;font-size:11px;line-height:1.6;color:rgba(0,0,0,.42);background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;pointer-events:none;font-family:inherit}';
    document.head.appendChild(st);
    fetch('data/version.json').then(function (r) { return r.json(); }).then(function (v) {
      var d = document.createElement('div');
      d.id = 'siteVersion';
      d.textContent = 'v' + v.version;
      d.title = '主站 ' + v.commitsMain + ' 次 + 子站 ' + v.commitsSub + ' 次 = ' + (v.commitsMain + v.commitsSub) + ' 次提交';
      document.body.appendChild(d);
    }).catch(function () {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
  else paint();
})();</script></head>
<body>
    <div>
        <p>本子站只负责帖子，正在跳转到帖子列表…</p>
        <p><a href="posts.html">如果没有自动跳转，点这里</a></p>
    </div>
</body>
</html>
